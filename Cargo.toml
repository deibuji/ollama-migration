[package]
name = "ollama-migrator"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
indicatif = "0.17"
memmap2 = "0.9"
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
uuid = { version = "1.7", features = ["v4"] }
